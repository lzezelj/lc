services:
  postgres:
    image: postgres:17-alpine
    container_name: lc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lc
      POSTGRES_USER: lc
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lc -d lc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lc_postgres_data:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: lc-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  lc_postgres_data:
