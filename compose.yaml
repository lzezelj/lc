services:
  postgres:
    image: postgres:17-alpine
    container_name: lc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lc
      POSTGRES_USER: lc
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lc -d lc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lc_postgres_data:/var/lib/postgresql/data

volumes:
  lc_postgres_data:
